<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        .error-message { color: red; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Login Screen</h2>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username:</label><br>
            <input type="text" id="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label><br>
            <input type="password" id="password" required>
        </div>
        
        <button type="submit">Log In</button>
    </form>

    <div id="errorMessage" class="error-message"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            if (passwordInput === "lasagna") {
                errorDiv.textContent = ""; 
                
                // Set the session flag in localStorage
                localStorage.setItem('isLoggedIn', 'true');
                
                window.location.href = "http://127.0.0.1:5501/assets/scripts/pages/private.html"; 
            } else {
                errorDiv.textContent = "Wrong Password";
                document.getElementById('password').value = ""; 
            }
        });
    </script>

</body>
</html>
